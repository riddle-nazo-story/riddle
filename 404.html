<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | RIDDLE STORY</title>

  <script>
    /*
      GitHub Pagesにはサーバー側のrewriteがないため、
      /redirect/xxxxxxxx/ を custom 404 で受けて redirect.html へ渡します。
    */
    (function(){
      const match = location.pathname.match(/^\/redirect\/([^/]+)\/?$/i);

      if(!match) return;

      let slug = "";

      try{
        slug = decodeURIComponent(match[1]).trim();
      }catch(e){}

      if(slug){
        location.replace("/redirect.html?slug=" + encodeURIComponent(slug));
      }
    })();
  </script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:#f7f8fa;color:#1f2937;
      font-family:"Helvetica Neue","Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif
    }
    .card{
      width:min(100%,520px);padding:40px 28px;text-align:center;
      background:#fff;border:1px solid #e5e7eb;border-radius:18px
    }
    h1{margin:0 0 10px;font-size:28px}
    p{margin:0;color:#6b7280;line-height:1.8}
    a{
      display:inline-flex;margin-top:24px;padding:12px 18px;border-radius:10px;
      background:#111827;color:#fff;text-decoration:none;font-weight:700
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <a href="/">トップページへ</a>
  </main>
</body>
</html>
